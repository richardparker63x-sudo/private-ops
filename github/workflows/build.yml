name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash setup.sh
      - run: flutter build apk --release
        working-directory: private_ops_app
      - uses: actions/upload-artifact@v4
        with:
          name: private-ops-apk
          path: private_ops_app/build/app/outputs/flutter-apk/app-release.apk
